<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ YZ - وای زد | همه‌چیزتمام</title>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-darker: #050508;
            --bg-panel: #111122;
            --neon-primary: #00ffff;
            --neon-secondary: #0088ff;
            --neon-danger: #ff0044;
            --text-primary: #e0e0e0;
            --text-bright: #ffffff;
            --text-dim: #666;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(0, 255, 255, 0.15);
            --sidebar-width: 280px;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Vazirmatn', 'Segoe UI', Tahoma, 'Iranian Sans', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; font-family:var(--font); background:var(--bg-dark); color:var(--text-primary); overflow:hidden; direction:rtl; }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background:var(--neon-primary); border-radius:3px; }
        button { cursor:pointer; font-family:var(--font); border:none; outline:none; background:none; color:inherit; }
        input, textarea, select { font-family:var(--font); outline:none; border:none; background:none; color:inherit; }
        .app-container { display:flex; height:100vh; width:100vw; background:var(--bg-dark); position:relative; overflow:hidden; }
        .sidebar { width:var(--sidebar-width); min-width:var(--sidebar-width); background:var(--bg-darker); border-left:1px solid var(--glass-border); display:flex; flex-direction:column; padding:20px 16px; gap:14px; z-index:10; backdrop-filter:blur(20px); transition:var(--transition); }
        .sidebar-logo { text-align:center; font-size:2rem; font-weight:900; letter-spacing:2px; color:var(--neon-primary); text-shadow:0 0 20px var(--neon-primary),0 0 40px rgba(0,255,255,0.35); animation:logoPulse 3s infinite; }
        @keyframes logoPulse { 0%,100%{ text-shadow:0 0 20px var(--neon-primary),0 0 40px rgba(0,255,255,0.35); } 50%{ text-shadow:0 0 30px var(--neon-primary),0 0 60px rgba(0,255,255,0.5); } }
        .btn-new-chat { display:flex; align-items:center; justify-content:center; gap:8px; padding:14px 20px; border-radius:var(--radius); background:linear-gradient(135deg,var(--neon-primary),var(--neon-secondary)); color:#000; font-weight:700; font-size:1rem; transition:var(--transition); box-shadow:0 4px 20px rgba(0,255,255,0.25); }
        .btn-new-chat:hover { transform:scale(1.04); box-shadow:0 6px 30px rgba(0,255,255,0.45); }
        .model-selector { padding:12px 14px; border-radius:var(--radius-sm); background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--text-primary); font-size:0.9rem; cursor:pointer; transition:var(--transition); width:100%; }
        .model-selector option { background:var(--bg-panel); color:var(--text-primary); }
        .conversation-history { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
        .conversation-history-title { font-size:0.8rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px; padding:8px 4px; border-bottom:1px solid rgba(255,255,255,0.05); }
        .conv-item { padding:12px 14px; border-radius:var(--radius-sm); background:var(--glass-bg); border:1px solid transparent; cursor:pointer; transition:var(--transition); position:relative; }
        .conv-item:hover { border-color:var(--neon-primary); background:rgba(0,255,255,0.05); }
        .conv-item.active { border-color:var(--neon-primary); background:rgba(0,255,255,0.08); }
        .conv-item-title { font-size:0.85rem; font-weight:600; color:var(--text-bright); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .conv-item-meta { font-size:0.7rem; color:var(--text-dim); display:flex; justify-content:space-between; }
        .conv-item-delete { position:absolute; top:8px; left:8px; width:24px; height:24px; border-radius:50%; background:rgba(255,0,68,0.15); border:1px solid rgba(255,0,68,0.3); color:var(--neon-danger); font-size:0.7rem; display:none; align-items:center; justify-content:center; }
        .conv-item:hover .conv-item-delete { display:flex; }
        .sidebar-footer { padding-top:8px; border-top:1px solid rgba(255,255,255,0.05); display:flex; flex-direction:column; gap:10px; }
        .hidden-phrase { text-align:center; font-size:0.75rem; color:rgba(0,255,255,0.13); cursor:pointer; user-select:none; transition:var(--transition); }
        .hidden-phrase:hover { color:rgba(0,255,255,0.25); }
        .sidebar-version { text-align:center; font-size:0.7rem; color:#444; }
        .main-area { flex:1; display:flex; flex-direction:column; background:var(--bg-dark); position:relative; overflow:hidden; }
        .main-header { padding:16px 24px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.05); background:rgba(10,10,15,0.8); backdrop-filter:blur(20px); }
        .main-header-title { font-size:1rem; font-weight:700; color:var(--text-bright); }
        .status-indicator { display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--neon-primary); }
        .status-dot { width:10px; height:10px; border-radius:50%; background:var(--neon-primary); box-shadow:0 0 10px var(--neon-primary); animation:dotPulse 2s infinite; }
        @keyframes dotPulse { 0%,100%{ box-shadow:0 0 10px var(--neon-primary); } 50%{ box-shadow:0 0 20px var(--neon-primary); } }
        .chat-area { flex:1; overflow-y:auto; padding:24px 32px; display:flex; flex-direction:column; gap:16px; }
        .message { max-width:75%; padding:14px 18px; border-radius:var(--radius); animation:msgIn 0.3s ease-out; word-wrap:break-word; line-height:1.7; }
        @keyframes msgIn { from{ opacity:0; transform:translateY(15px) scale(0.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
        .message.user { align-self:flex-start; background:linear-gradient(135deg,#1a2a6c,#0d47a1); color:var(--text-bright); border-bottom-left-radius:4px; box-shadow:0 4px 20px rgba(13,71,161,0.35); }
        .message.ai { align-self:flex-end; background:var(--glass-bg); border:1px solid var(--glass-border); border-bottom-right-radius:4px; backdrop-filter:blur(20px); }
        .message-model-tag { display:inline-block; font-size:0.65rem; padding:2px 8px; border-radius:20px; background:rgba(0,255,255,0.1); border:1px solid rgba(0,255,255,0.25); color:var(--neon-primary); margin-top:6px; }
        .message.user .message-model-tag { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.2); color:rgba(255,255,255,0.8); }
        .typing-indicator { display:inline-flex; gap:5px; align-items:center; }
        .typing-indicator span { width:8px; height:8px; border-radius:50%; background:var(--neon-primary); animation:typingBounce 1.4s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay:0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay:0.4s; }
        @keyframes typingBounce { 0%,60%,100%{ transform:translateY(0); opacity:0.4; } 30%{ transform:translateY(-8px); opacity:1; } }
        .message-image { max-width:300px; max-height:300px; border-radius:var(--radius-sm); margin-top:8px; border:1px solid var(--glass-border); }
        .input-area { padding:16px 24px 20px; border-top:1px solid rgba(255,255,255,0.05); background:rgba(10,10,15,0.9); backdrop-filter:blur(20px); display:flex; flex-direction:column; gap:10px; }
        .input-container { display:flex; gap:12px; align-items:flex-end; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius); padding:12px 16px; transition:var(--transition); }
        .input-container:focus-within { border-color:var(--neon-primary); box-shadow:0 0 25px rgba(0,255,255,0.15); }
        .input-textarea { flex:1; background:transparent; border:none; color:var(--text-primary); font-size:0.95rem; resize:none; min-height:42px; max-height:180px; line-height:1.6; }
        .btn-send { padding:12px 24px; border-radius:var(--radius-sm); background:linear-gradient(135deg,var(--neon-primary),var(--neon-secondary)); color:#000; font-weight:700; transition:var(--transition); }
        .btn-send:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(0,255,255,0.5); }
        .btn-send:disabled { opacity:0.4; cursor:not-allowed; }
        .char-counter { font-size:0.7rem; color:var(--text-dim); text-align:left; }
        .char-counter.warning { color:#ffaa00; }
        .char-counter.danger { color:var(--neon-danger); font-weight:700; }
        .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .tool-btn { padding:8px 14px; border-radius:var(--radius-sm); background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--text-primary); font-size:0.8rem; cursor:pointer; transition:var(--transition); display:flex; align-items:center; gap:4px; }
        .tool-btn:hover { border-color:var(--neon-primary); background:rgba(0,255,255,0.08); }
        .tool-btn.recording { background:rgba(255,0,68,0.15); border-color:var(--neon-danger); color:var(--neon-danger); animation:recPulse 1s infinite; }
        @keyframes recPulse { 0%,100%{ box-shadow:0 0 10px rgba(255,0,68,0.2); } 50%{ box-shadow:0 0 25px rgba(255,0,68,0.5); } }
        .admin-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.96); z-index:1000; overflow-y:auto; padding:30px; backdrop-filter:blur(20px); }
        .admin-overlay.active { display:block; }
        .admin-container { max-width:1100px; margin:0 auto; background:var(--bg-panel); border-radius:var(--radius); padding:30px; border:1px solid var(--glass-border); position:relative; }
        .admin-close-btn { position:absolute; top:16px; left:16px; width:40px; height:40px; border-radius:50%; background:rgba(255,0,68,0.15); border:1px solid rgba(255,0,68,0.4); color:var(--neon-danger); font-size:1.2rem; display:flex; align-items:center; justify-content:center; }
        .admin-title { font-size:1.5rem; font-weight:800; color:var(--neon-primary); text-align:center; margin-bottom:24px; }
        .admin-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
        .stat-card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-sm); padding:20px; text-align:center; }
        .stat-card-icon { font-size:2rem; margin-bottom:8px; }
        .stat-card-value { font-size:1.8rem; font-weight:800; color:var(--text-bright); }
        .stat-card-label { font-size:0.8rem; color:var(--text-dim); }
        .admin-actions { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; justify-content:center; }
        .admin-btn { padding:12px 20px; border-radius:var(--radius-sm); font-size:0.9rem; font-weight:600; cursor:pointer; transition:var(--transition); border:1px solid var(--glass-border); display:flex; align-items:center; gap:6px; }
        .admin-btn.primary { background:rgba(0,255,255,0.1); border-color:var(--neon-primary); color:var(--neon-primary); }
        .admin-btn.danger { background:rgba(255,0,68,0.1); border-color:var(--neon-danger); color:var(--neon-danger); }
        .admin-table-section { margin-top:20px; overflow-x:auto; }
        .admin-table-section h3 { font-size:1.1rem; color:var(--neon-secondary); margin-bottom:12px; }
        .admin-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
        .admin-table th { background:rgba(255,255,255,0.05); color:var(--text-bright); padding:12px 14px; text-align:right; border-bottom:1px solid var(--glass-border); }
        .admin-table td { padding:10px 14px; border-bottom:1px solid rgba(255,255,255,0.03); }
        .table-action-btn { padding:4px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer; }
        .table-action-btn.edit { background:rgba(0,136,255,0.1); border-color:rgba(0,136,255,0.3); color:var(--neon-secondary); }
        .table-action-btn.delete { background:rgba(255,0,68,0.1); border-color:rgba(255,0,68,0.3); color:var(--neon-danger); }
        .password-modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center; backdrop-filter:blur(10px); }
        .password-modal.active { display:flex; }
        .password-box { background:var(--bg-panel); border:1px solid var(--glass-border); border-radius:var(--radius); padding:30px; text-align:center; width:340px; }
        .password-input { width:100%; padding:12px 16px; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-sm); color:var(--text-primary); font-size:1rem; text-align:center; margin-bottom:12px; }
        .password-submit { padding:12px 24px; background:linear-gradient(135deg,var(--neon-primary),var(--neon-secondary)); color:#000; font-weight:700; border-radius:var(--radius-sm); cursor:pointer; border:none; width:100%; }
        .password-error { color:var(--neon-danger); font-size:0.8rem; margin-bottom:8px; display:none; }
        @media (max-width:768px) {
            .sidebar { position:fixed; top:0; right:auto; left:-280px; height:100vh; z-index:100; transition:left 0.3s; }
            .sidebar.mobile-open { left:0; }
            .chat-area { padding:16px; }
            .message { max-width:90%; }
            .mobile-menu-btn { display:flex !important; }
        }
        .mobile-menu-btn { display:none; position:fixed; top:16px; right:16px; z-index:200; width:40px; height:40px; border-radius:10px; background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--neon-primary); font-size:1.3rem; align-items:center; justify-content:center; }
        .news-result { padding:10px 14px; background:rgba(255,255,255,0.04); border-radius:var(--radius-sm); border:1px solid var(--glass-border); margin-top:8px; font-size:0.85rem; }
        .news-result a { color:var(--neon-secondary); text-decoration:none; }
    </style>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">⚡ YZ</div>
            <button class="btn-new-chat" onclick="createNewConversation()">+ گفتگوی جدید</button>
            <select class="model-selector" id="modelSelector" onchange="onModelChange()">
                <option value="auto">🤖 خودکار (Auto-Router)</option>
                <option value="openai">🧠 OpenAI GPT-4o</option>
                <option value="gemini">🌟 Google Gemini Pro</option>
                <option value="claude">💎 Claude 3.5 Sonnet</option>
                <option value="dalle">🎨 DALL-E (تولید عکس)</option>
            </select>
            <div class="conversation-history" id="conversationList">
                <div class="conversation-history-title">📋 تاریخچه گفتگوها</div>
            </div>
            <div class="sidebar-footer">
                <div class="hidden-phrase" id="hiddenPhrase" onclick="handleHiddenPhraseClick()">✦ آزادی ✦</div>
                <div class="sidebar-version">🔮 نسخه ۵.۰ · همه‌چیزتمام</div>
            </div>
        </aside>

        <!-- Main Area -->
        <main class="main-area">
            <header class="main-header">
                <div class="main-header-title" id="mainHeaderTitle">گفتگوی جدید</div>
                <div class="status-indicator"><span class="status-dot"></span> ● آنلاین | YZ Core</div>
            </header>
            <div class="chat-area" id="chatArea"></div>
            <div class="input-area">
                <div class="input-container">
                    <textarea class="input-textarea" id="inputTextarea" rows="1" placeholder="پیام خود را بنویسید..." maxlength="10000" oninput="onInputChange()" onkeydown="onInputKeydown(event)"></textarea>
                    <button class="btn-send" id="btnSend" onclick="sendMessage()" disabled>ارسال 🚀</button>
                </div>
                <div class="char-counter" id="charCounter">۰ / ۱۰,۰۰۰</div>
                <div class="toolbar">
                    <button class="tool-btn" onclick="triggerFileUpload()">📎 فایل</button>
                    <input type="file" id="fileInput" style="display:none" multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt" onchange="handleFileUpload(event)">
                    <button class="tool-btn" onclick="generateImage()">🎨 تولید عکس</button>
                    <button class="tool-btn" onclick="generateMusic()">🎵 تولید موسیقی</button>
                    <button class="tool-btn" onclick="searchNews()">📰 جستجوی خبر</button>
                    <button class="tool-btn" id="btnRecord" onclick="toggleRecording()">🎤 ضبط صدا</button>
                    <button class="tool-btn" onclick="speakLastMessage()">🔊 گفتار</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Admin Panel -->
    <div class="admin-overlay" id="adminOverlay">
        <div class="admin-container">
            <button class="admin-close-btn" onclick="closeAdminPanel()">✕</button>
            <h2 class="admin-title">🔐 پنل مدیریت وای زد</h2>
            <div class="admin-stats">
                <div class="stat-card"><div class="stat-card-icon">👥</div><div class="stat-card-value" id="statUsers">۱</div><div class="stat-card-label">کاربران</div></div>
                <div class="stat-card"><div class="stat-card-icon">💬</div><div class="stat-card-value" id="statConversations">۰</div><div class="stat-card-label">گفتگوها</div></div>
                <div class="stat-card"><div class="stat-card-icon">📝</div><div class="stat-card-value" id="statMessages">۰</div><div class="stat-card-label">پیام‌ها</div></div>
            </div>
            <div class="admin-actions">
                <button class="admin-btn primary" onclick="adminRefresh()">🔄 بروزرسانی</button>
                <button class="admin-btn primary" onclick="adminExportJSON()">📤 خروجی JSON</button>
                <button class="admin-btn danger" onclick="adminClearAll()">🗑️ پاک کردن همه داده‌ها</button>
            </div>
            <div class="admin-table-section">
                <h3>👥 جدول کاربران</h3>
                <table class="admin-table"><thead><tr><th>شناسه</th><th>نام</th><th>ایمیل</th><th>تاریخ ثبت</th><th>عملیات</th></tr></thead><tbody id="adminUserTable"></tbody></table>
            </div>
            <div class="admin-table-section">
                <h3>💬 جدول گفتگوها</h3>
                <table class="admin-table"><thead><tr><th>شناسه</th><th>عنوان</th><th>تاریخ</th><th>تعداد پیام</th></tr></thead><tbody id="adminConvTable"></tbody></table>
            </div>
        </div>
    </div>

    <!-- Password Modal -->
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h3>🔐 رمز عبور مدیریت</h3>
            <div class="password-error" id="passwordError">رمز عبور اشتباه است!</div>
            <input type="password" class="password-input" id="passwordInput" placeholder="رمز عبور..." maxlength="20">
            <button class="password-submit" onclick="verifyPassword()">ورود</button>
        </div>
    </div>

    <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileSidebar()">☰</button>

    <script>
        // ===================== CONFIG =====================
        const CONFIG = {
            OPENAI_KEY: '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',
            GEMINI_KEY: 'AQ.Ab8RN6I0QawYfjzDxPgBAo7kNFUqBtfDvP_g7FWTRISkbVtDxA',
            CLAUDE_KEY: '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',
            NEWSAPI_KEY: 'f8b1fdf900d34242a2d73951e69d558f',
            FAL_KEY: '54ee049c-3fc4-497f-ae21-fbbbc9b250cf:00e80850b7f2e240e3cba595d5c07f12',
            JSONBIN_KEY: '$2a$10$Jup4yNzrYQnSHhGbs1/DR.XGTeVPWBvC5R6m/tiBiRd8rVo.KxBcG',
            JSONBIN_BIN_ID: '6a87318af5f4af5e292dbb81',
            ADMIN_PASSWORD: '1402',
            MAX_CHARS: 10000,
            WARNING_THRESHOLD: 0.8,
        };

        // ===================== STATE =====================
        let state = {
            currentUser: { id:1, name:'مدیر', email:'admin@yz.com', createdAt:new Date().toISOString() },
            conversations: [],
            messages: [],
            currentConversationId: null,
            settings: { siteName:'وای زد', theme:'dark', adminPassword:CONFIG.ADMIN_PASSWORD },
            hiddenClickCount: 0,
            isRecording: false,
            mediaRecorder: null,
            audioChunks: [],
            isGenerating: false,
            currentModel: 'auto',
            demoMode: false
        };

        // ===================== DB (JSONbin) =====================
        async function loadDB() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': CONFIG.JSONBIN_KEY }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.record) {
                        state.conversations = data.record.conversations || [];
                        state.messages = data.record.messages || [];
                        state.settings = data.record.settings || state.settings;
                        state.currentUser = data.record.users && data.record.users[0] || state.currentUser;
                        return true;
                    }
                }
                return false;
            } catch(err) {
                console.warn('JSONbin load error, using localStorage:', err);
                const local = localStorage.getItem('yz_db');
                if (local) {
                    const parsed = JSON.parse(local);
                    state.conversations = parsed.conversations || [];
                    state.messages = parsed.messages || [];
                    state.settings = parsed.settings || state.settings;
                    state.currentUser = parsed.users && parsed.users[0] || state.currentUser;
                }
                return false;
            }
        }

        async function saveDB() {
            const payload = {
                users: [state.currentUser],
                conversations: state.conversations,
                messages: state.messages,
                settings: state.settings
            };
            localStorage.setItem('yz_db', JSON.stringify(payload));

        // ===================== AI CALLS (with fallback) =====================
        async function getAIResponse(prompt, model, onStream) {
            // Try real API, if error -> fallback
            try {
                if (model === 'openai') return await callOpenAI(prompt, onStream);
                else if (model === 'gemini') return await callGemini(prompt, onStream);
                else if (model === 'claude') return await callClaude(prompt, onStream);
                else if (model === 'auto') {
                    try { return await callOpenAI(prompt, onStream); }
                    catch { try { return await callGemini(prompt, onStream); } catch { return await callClaude(prompt, onStream); } }
                } else if (model === 'dalle') return await generateImageResponse(prompt);
                else return getFallbackResponse(prompt, model);
            } catch(err) {
                console.warn('API call failed, using fallback:', err);
                state.demoMode = true;
                const fallback = getFallbackResponse(prompt, model);
                if (onStream) await simulateStream(fallback, onStream);
                return fallback;
            }
        }

        async function callOpenAI(prompt, onStream) {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${CONFIG.OPENAI_KEY}` },
                body: JSON.stringify({ model:'gpt-4o', messages:[{role:'user',content:prompt}], max_tokens:1000, temperature:0.7 })
            });
            if (!response.ok) throw new Error(`OpenAI API error: ${response.status}`);
            const data = await response.json();
            const text = data.choices?.[0]?.message?.content || 'پاسخی دریافت نشد.';
            if (onStream) await simulateStream(text, onStream);
            return text;
        }

        async function callGemini(prompt, onStream) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${CONFIG.GEMINI_KEY}`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ contents:[{parts:[{text:prompt}]}], generationConfig:{maxOutputTokens:1000, temperature:0.7} })
            });
            if (!response.ok) throw new Error(`Gemini API error: ${response.status}`);
            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text || 'پاسخی دریافت نشد.';
            if (onStream) await simulateStream(text, onStream);
            return text;
        }

        async function callClaude(prompt, onStream) {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method:'POST',
                headers:{'Content-Type':'application/json','x-api-key':CONFIG.CLAUDE_KEY,'anthropic-version':'2023-06-01'},
                body: JSON.stringify({ model:'claude-3-5-sonnet-20241022', max_tokens:1000, messages:[{role:'user',content:prompt}] })
            });
            if (!response.ok) throw new Error(`Claude API error: ${response.status}`);
            const data = await response.json();
            const text = data.content?.[0]?.text || 'پاسخی دریافت نشد.';
            if (onStream) await simulateStream(text, onStream);
            return text;
        }

        async function simulateStream(fullText, onStream) {
            const chunks = fullText.match(/.{1,3}/g) || [fullText];
            let accumulated = '';
            for (const chunk of chunks) {
                accumulated += chunk;
                onStream && onStream(accumulated, false);
                await new Promise(resolve => setTimeout(resolve, 20 + Math.random()*30));
            }
            onStream && onStream(fullText, true);
        }

        async function generateImageResponse(prompt) {
            // Try Fal.ai, fallback to placeholder
            try {
                const response = await fetch('https://api.fal.ai/v1/comfy/run', {
                    method:'POST',
                    headers:{'Content-Type':'application/json','Authorization':`Key ${CONFIG.FAL_KEY}`},
                    body: JSON.stringify({ workflow:'text-to-image', prompt:prompt, negative_prompt:'blurry, low quality' })
                });
                if (!response.ok) throw new Error('Fal.ai error');
                const data = await response.json();
                const url = data.images?.[0]?.url || data.url || 'https://via.placeholder.com/512x512/1a1a2e/00ffff?text=YZ+Generated+Image';
                return { type:'image', url:url, caption:`🎨 تصویر تولید شده: "${prompt.substring(0,60)}"` };
            } catch(err) {
                console.warn('Image API failed, using placeholder');
                return { type:'image', url:'https://via.placeholder.com/512x512/1a1a2e/00ffff?text=YZ+Demo+Image', caption:`🎨 تصویر نمایشی: "${prompt.substring(0,60)}"` };
            }
        }

        // ===================== VOICE RECORDING =====================
        async function toggleRecording() {
            const btn = document.getElementById('btnRecord');
            if (!state.isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    state.mediaRecorder = new MediaRecorder(stream);
                    state.audioChunks = [];
                    state.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) state.audioChunks.push(e.data); };
                    state.mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(state.audioChunks, { type:'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        addMessage('user', '🎤 (پیام صوتی ضبط شده)', 'voice', audioUrl);
                        stream.getTracks().forEach(track => track.stop());
                    };
                    state.mediaRecorder.start();
                    state.isRecording = true;
                    btn.classList.add('recording');
                    btn.textContent = '⏹️ توقف ضبط';
                } catch(err) {
                    alert('دسترسی به میکروفون امکان‌پذیر نیست.');
                }
            } else {
                state.mediaRecorder.stop();
                state.isRecording = false;
                btn.classList.remove('recording');
                btn.textContent = '🎤 ضبط صدا';
            }
        }

        // ===================== FILE UPLOAD =====================
        function triggerFileUpload() { document.getElementById('fileInput').click(); }
        function handleFileUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            for (const file of files) {
                const fileName = file.name;
                const fileSize = (file.size / 1024).toFixed(1) + ' KB';
                const fileType = file.type || 'نامشخص';
                const icon = getFileIcon(fileType, fileName);
                if (fileType.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = e => addMessage('user', `${icon} ${fileName} (${fileSize})`, 'file', e.target.result);
                    reader.readAsDataURL(file);
                } else {
                    addMessage('user', `${icon} ${fileName} (${fileSize})`, 'file');
                }
            }
            event.target.value = '';
        }
        function getFileIcon(type, name) {
            if (type.startsWith('image/')) return '🖼️';
            if (type.startsWith('video/')) return '🎬';
            if (type.startsWith('audio/')) return '🎵';
            if (type === 'application/pdf') return '📄';
            if (name.endsWith('.doc') || name.endsWith('.docx')) return '📝';
            if (name.endsWith('.xls') || name.endsWith('.xlsx')) return '📊';
            if (name.endsWith('.ppt') || name.endsWith('.pptx')) return '📑';
            if (name.endsWith('.txt')) return '📃';
            return '📎';
        }

        // ===================== CHAT FUNCTIONS =====================
        function createNewConversation() {
            state.currentConversationId = null;
            state.hiddenClickCount = 0;
            document.getElementById('mainHeaderTitle').textContent = 'گفتگوی جدید';
            document.getElementById('chatArea').innerHTML = '';
            document.getElementById('inputTextarea').value = '';
            onInputChange();
            updateConversationList();
        }
        function onModelChange() { state.currentModel = document.getElementById('modelSelector').value; }
        function onInputChange() {
            const textarea = document.getElementById('inputTextarea');
            const counter = document.getElementById('charCounter');
            const btnSend = document.getElementById('btnSend');
            const length = textarea.value.length;
            const max = CONFIG.MAX_CHARS;
            const warning = Math.floor(max * CONFIG.WARNING_THRESHOLD);
            counter.textContent = `${length.toLocaleString('fa-IR')} / ${max.toLocaleString('fa-IR')}`;
            counter.classList.remove('warning','danger');
            if (length >= max) counter.classList.add('danger');
            else if (length >= warning) counter.classList.add('warning');
            btnSend.disabled = length === 0 || state.isGenerating;
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 180) + 'px';
        }
        function onInputKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        async function sendMessage() {
            const textarea = document.getElementById('inputTextarea');
            const prompt = textarea.value.trim();
            if (!prompt || state.isGenerating) return;
            state.isGenerating = true;
            document.getElementById('btnSend').disabled = true;

            if (!state.currentConversationId) {
                const newConv = { id:generateId(), title:generateConversationTitle(prompt), createdAt:new Date().toISOString(), messageCount:0 };
                state.conversations.unshift(newConv);
                state.currentConversationId = newConv.id;
                document.getElementById('mainHeaderTitle').textContent = newConv.title;
            }
            const convId = state.currentConversationId;
            const model = state.currentModel || 'auto';

            // Add user message
            addMessage('user', prompt, model);
            state.messages.push({ convId, role:'user', content:prompt, model, timestamp:new Date().toISOString() });

            // Update conv count
            const conv = state.conversations.find(c => c.id === convId);
            if (conv) conv.messageCount = state.messages.filter(m => m.convId === convId).length;

            textarea.value = '';
            onInputChange();
            updateConversationList();
            await saveDB();

            // Thinking indicator
            const thinkingId = addThinkingMessage();

            try {
                const response = await getAIResponse(prompt, model, (streamedText, done) => {
                    updateStreamingMessage(streamedText, done, thinkingId);
                });

                removeThinkingMessage(thinkingId);
                if (typeof response === 'object' && response.type === 'image') {
                    addMessage('ai', response.caption, 'dalle', response.url);
                    state.messages.push({ convId, role:'ai', content:response.caption, model:'dalle', timestamp:new Date().toISOString(), imageUrl:response.url });
                } else {
                    addMessage('ai', response, model);
                    state.messages.push({ convId, role:'ai', content:response, model, timestamp:new Date().toISOString() });
                }
                const conv2 = state.conversations.find(c => c.id === convId);
                if (conv2) conv2.messageCount = state.messages.filter(m => m.convId === convId).length;
                await saveDB();
                updateConversationList();
            } catch(err) {
                console.error('Unexpected error:', err);
                removeThinkingMessage(thinkingId);
                const errorMsg = '⚠️ خطای غیرمنتظره. لطفاً دوباره تلاش کنید.';
                addMessage('ai', errorMsg, 'system');
                state.messages.push({ convId, role:'ai', content:errorMsg, model:'system', timestamp:new Date().toISOString() });
            } finally {
                state.isGenerating = false;
                document.getElementById('btnSend').disabled = false;
                onInputChange();
                scrollChatToBottom();
            }
        }

        function addMessage(role, content, model, imageUrl) {
            const chatArea = document.getElementById('chatArea');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role === 'user' ? 'user' : 'ai'}`;
            msgDiv.setAttribute('data-role', role);
            msgDiv.setAttribute('data-model', model);
            let html = `<div>${content}</div>`;
            if (imageUrl) {
                if (imageUrl.startsWith('data:image')) html += `<img src="${imageUrl}" class="message-image">`;
                else if (imageUrl.startsWith('blob:')) html += `<audio controls src="${imageUrl}" style="width:100%;margin-top:8px;"></audio>`;
                else html += `<img src="${imageUrl}" class="message-image">`;
            }
            html += `<span class="message-model-tag">${getModelLabel(model)}</span>`;
            msgDiv.innerHTML = html;
            chatArea.appendChild(msgDiv);
            scrollChatToBottom();
        }

        function addThinkingMessage() {
            const chatArea = document.getElementById('chatArea');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai thinking';
            msgDiv.id = 'thinking-' + Date.now();
            msgDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div><span class="message-model-tag">در حال پردازش…</span>`;
            chatArea.appendChild(msgDiv);
            scrollChatToBottom();
            return msgDiv.id;
        }
        function removeThinkingMessage(id) { const el = document.getElementById(id); if (el) el.remove(); }
        function updateStreamingMessage(text, done, thinkingId) {
            if (thinkingId) {
                const el = document.getElementById(thinkingId);
                if (el) {
                    el.classList.remove('thinking');
                    el.innerHTML = `<div>${text.replace(/\n/g,'<br>')}</div><span class="message-model-tag">${getModelLabel(state.currentModel || 'auto')}</span>`;
                }
            }
            scrollChatToBottom();
        }
        function scrollChatToBottom() { const chat = document.getElementById('chatArea'); setTimeout(() => chat.scrollTop = chat.scrollHeight, 50); }

        function updateConversationList() {
            const list = document.getElementById('conversationList');
            const titleEl = document.querySelector('.conversation-history-title');
            list.innerHTML = '';
            if (titleEl) list.appendChild(titleEl);
            if (state.conversations.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'text-align:center;padding:20px;color:#555;';
                empty.textContent = 'هنوز گفتگویی ندارید';
                list.appendChild(empty);
                return;
            }
            state.conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conv-item' + (conv.id === state.currentConversationId ? ' active' : '');
                item.onclick = () => loadConversation(conv.id);
                item.innerHTML = `
                    <div class="conv-item-title">${conv.title}</div>
                    <div class="conv-item-meta"><span>${formatPersianDate(conv.createdAt)}</span><span>${conv.messageCount || 0} پیام</span></div>
                    <button class="conv-item-delete" onclick="event.stopPropagation(); deleteConversation(${conv.id})">✕</button>
                `;
                list.appendChild(item);
            });
        }

        function loadConversation(convId) {
            const conv = state.conversations.find(c => c.id === convId);
            if (!conv) return;
            state.currentConversationId = convId;
            document.getElementById('mainHeaderTitle').textContent = conv.title;
            document.getElementById('chatArea').innerHTML = '';
            const msgs = state.messages.filter(m => m.convId === convId);
            msgs.forEach(msg => addMessage(msg.role, msg.content, msg.model, msg.imageUrl));
            updateConversationList();
            scrollChatToBottom();
        }

        function deleteConversation(convId) {
            if (!confirm('آیا از حذف این گفتگو مطمئن هستید؟')) return;
            state.conversations = state.conversations.filter(c => c.id !== convId);
            state.messages = state.messages.filter(m => m.convId !== convId);
            if (state.currentConversationId === convId) createNewConversation();
            saveDB();
            updateConversationList();
        }

            alert('🗑️ تمام داده‌ها پاک شدند.');
        }
        function adminEditUser() { const newName = prompt('نام جدید:', state.currentUser.name); if (newName && newName.trim()) { state.currentUser.name = newName.trim(); saveDB(); refreshAdminPanel(); } }
        function adminDeleteUser() { alert('⚠️ کاربر مدیر قابل حذف نیست.'); }

        // ===================== MOBILE =====================
        function toggleMobileSidebar() { document.getElementById('sidebar').classList.toggle('mobile-open'); }

        // ===================== INIT =====================
        async function initApp() {
            document.getElementById('modelSelector').value = 'auto';
            state.currentModel = 'auto';
            await loadDB();
            updateConversationList();
            if (state.conversations.length > 0) loadConversation(state.conversations[0].id);
            else createNewConversation();
            document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') verifyPassword(); });
            document.getElementById('adminOverlay').addEventListener('click', e => { if (e.target === document.getElementById('adminOverlay')) closeAdminPanel(); });
            console.log('⚡ YZ Super-App initialized');
            console.log('🔐 برای دسترسی به پنل مدیریت: سه بار روی "✦ آزادی ✦" کلیک کنید و رمز 1402 را وارد کنید.');
        }
        initApp();
    </script>
</body>
</html>
