<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>تست YZ Worker</title>
    <style>
        body { background:#0a0a0f; color:#e0e0e0; font-family:Tahoma; padding:30px; direction:rtl; }
        button { padding:12px 24px; margin:5px; background:#00ffff; color:#000; border:none; border-radius:8px; cursor:pointer; font-size:16px; }
        button:hover { background:#0088ff; }
        pre { background:#1a1a2e; color:#00ffff; padding:20px; margin-top:20px; border-radius:10px; overflow:auto; white-space:pre-wrap; }
    </style>
</head>
<body>
    <h1>🔍 تست YZ Worker</h1>
    <button onclick="test('openai')">تست OpenAI</button>
    <button onclick="test('gemini')">تست Gemini</button>
    <button onclick="test('claude')">تست Claude</button>
    <pre id="result">نتیجه اینجا نمایش داده می‌شود...</pre>

    <script>
        async function test(target) {
            document.getElementById('result').textContent = '⏳ در حال تست ' + target + '...';
            try {
                const response = await fetch('https://twilight-bird-de54.amirmohad208.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: target, prompt: 'Say hello in one word' })
                });
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch(err) {
                document.getElementById('result').textContent = '❌ خطا: ' + err.message;
            }
        }
    </script>
</body>
</html>
