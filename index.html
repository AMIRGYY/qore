<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>تست Gemini جدید</title>
    <style>
        body { background:#0a0a0f; color:#e0e0e0; font-family:Tahoma; padding:30px; direction:rtl; }
        button { padding:15px 30px; margin:10px; background:#00ffff; color:#000; border:none; border-radius:10px; cursor:pointer; font-size:18px; font-weight:bold; }
        button:hover { background:#0088ff; color:white; }
        pre { background:#1a1a2e; color:#00ffff; padding:20px; margin-top:20px; border-radius:10px; overflow:auto; white-space:pre-wrap; }
        input { padding:12px; width:80%; font-size:16px; border-radius:8px; border:1px solid #00ffff; background:#1a1a2e; color:#fff; }
    </style>
</head>
<body>
    <h1>🔍 تست Gemini با کلید جدید</h1>
    <input type="text" id="prompt" value="سلام، حالت چطوره؟" placeholder="پیام خود را بنویسید...">
    <br><br>
    <button onclick="testGemini()">🚀 تست Gemini</button>
    <button onclick="testWorker()">🔌 تست Worker</button>
    <pre id="result">نتیجه اینجا نمایش داده می‌شود...</pre>

    <script>
        async function testGemini() {
            const prompt = document.getElementById('prompt').value;
            document.getElementById('result').textContent = '⏳ در حال تست Gemini...';
            try {
                const response = await fetch(
                    'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=AQ.Ab8RN6J5JQjK9OmdEnbgASlrVDRBL9IxH5cC3axBJL6EICmWVw',
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                        }),
                    }
                );
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch(err) {
                document.getElementById('result').textContent = '❌ خطا: ' + err.message;
            }
        }

        async function testWorker() {
            const prompt = document.getElementById('prompt').value;
            document.getElementById('result').textContent = '⏳ در حال تست Worker...';
            try {
                const response = await fetch('https://twilight-bird-de54.amirmohad208.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: 'gemini', prompt: prompt }),
                });
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch(err) {
                document.getElementById('result').textContent = '❌ خطا: ' + err.message;
            }
        }
    </script>
</body>
</html>
